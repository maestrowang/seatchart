name: tests

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

# A second push to the same branch cancels the first -- the suite takes a few
# minutes and there's no value in finishing a run for superseded code.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # Full suite measured at 2m37s locally; this is headroom for a slow runner,
    # not a target. It exists so a hung jsdom test fails instead of burning the
    # default 6 hours.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: tests/package-lock.json

      # npm ci (not install) so the run is pinned to tests/package-lock.json.
      - name: Install jsdom
        run: npm ci
        working-directory: tests

      # Reads index.html directly -- nothing to build or stage first.
      - name: Test suite
        run: bash tests/run-all.sh

      # DOM-free, so this would still catch a spacing-model regression even if
      # the jsdom suite above could not run at all.
      - name: Design suites
        run: bash design/run-all.sh
